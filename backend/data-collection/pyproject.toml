[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rutgers-bus-collector"
version = "0.1.0"
description = "One-shot RUBus ingestion into the Rutgers Kalshi Supabase project"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
rutgers-bus-collect-once = "rutgers_bus_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

